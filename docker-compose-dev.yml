# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: antipoaching_postgres_dev
    environment:
      POSTGRES_DB: anti-poaching-system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anti-poaching-system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antipoaching_network_dev
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: antipoaching_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antipoaching_network_dev
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: antipoaching_backend_dev
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/anti-poaching-system
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-do-not-use-in-production}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - /app/venv
      - /app/__pycache__
      - uploads_data_dev:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - antipoaching_network_dev
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: antipoaching_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - antipoaching_network_dev
    restart: unless-stopped

networks:
  antipoaching_network_dev:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
  uploads_data_dev:
  